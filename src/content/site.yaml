# Info umum situs: dipakai di <head> (judul tab, SEO) dan navbar.
name: Parametrik
description: Parametrik Solusi Integrasi
url: https://parametris.com
lang: id

# Tombol aksi utama di navbar
cta:
  label: Kontak
  href: /kontak

# Kontak perusahaan: dipakai section `contact` (halaman /kontak). Baris yang dihapus tidak akan tampil.
# TODO: placeholder, ganti dengan data asli.
contact:
  email: email@example.com
  phone: +62 21 0000 0000
  address:
    - Address line 1
    - City, Postal Code
  hours: Senin–Jumat, 08.00–17.00

# Navbar (item menunya dari src/content/menu/*.yaml)
navbar:
  # Variasi: src/components/layout/navbar/ · bandingkan di /prototype/navbar · status di src/content/variants.yaml
  variant: NavbarPanel_001

# Footer (semua isinya opsional; baris yang dihapus tidak akan tampil)
footer:
  # Nama file variasi di src/components/layout/footer/
  variant: FooterSimple_001
  company: PT Parametrik Solusi Integrasi
  # Alamat: 1 baris = 1 item
  address:
    - Alamat baris 1
    - Kota, Kode Pos, Indonesia
  email: info@parametris.com
  # Judul di atas ikon media sosial
  socialsTitle: Ikuti Kami
  # Media sosial: tambah/hapus item sesuai kebutuhan.
  # platform yang dikenali: facebook, instagram, linkedin, youtube, x, tiktok, whatsapp
  socials:
    - platform: facebook
      href: "#"
    - platform: x
      href: "#"
    - platform: youtube
      href: "#"
    - platform: linkedin
      href: "#"

# Halaman artikel (/posts/<slug>/)
post:
  # Nama file variasi di src/components/sections/post/. Satu artikel boleh menimpanya lewat `variant:` di frontmatter.
  variant: PostArticle_001
  # Teks kecil di halaman artikel
  labels:
    author: Penulis
    published: Terbit
    updated: Diperbarui
    tags: Tag
    toc: Daftar isi
    related: Artikel terkait
