title: "Internet of things"
description: "Hubungkan perangkat dan sistem melalui internet untuk pertukaran data, pemantauan real-time, dan otomatisasi proses."

sections:
  - type: hero
    variant: HeroText_001
    size: default
    eyebrow: "PRODUK / INTERNET OF THINGS"
    aside: { label: "Beranda", href: / }
    title: "Perangkat terhubung."
    accent: "Operasi terintegrasi."
    description: "Hubungkan perangkat dan sistem melalui internet untuk pertukaran data, pemantauan real-time, dan otomatisasi proses."
    actions:
      - { label: "Diskusikan kebutuhan", href: "/contact" }

  - type: cards
    variant: CardsGallery_001
    tone: dark
    from: iot
    linkLabel: "Jelajahi"

  - type: features
    variant: FeaturesRows_001
    eyebrow: "KAPABILITAS"
    items:
      - title: "Konektivitas perangkat"
        description: "Menghubungkan sensor, mesin, dan peralatan untuk pertukaran data yang efisien."
      - title: "Pemantauan real-time"
        description: "Data langsung dari perangkat untuk analisis dan pengambilan keputusan lebih cepat."
      - title: "Otomatisasi proses"
        description: "Otomatisasi tugas berdasarkan data untuk meningkatkan efisiensi dan produktivitas."
      - title: "Keamanan terintegrasi"
        description: "Protokol keamanan untuk melindungi perangkat, data, dan integritas sistem."
      - title: "Integrasi multiplatform"
        description: "Integrasi berbagai platform dan sistem menjadi solusi yang fleksibel."

