    variant: BenefitsIcons_001
    eyebrow: "MANFAAT & KEUNGGULAN"
    items:
      - title: "Efisiensi operasional"
        icon: gauge
        description: "Kurangi pekerjaan manual melalui pemantauan dan kontrol otomatis."
      - title: "Penghematan biaya"
        icon: chart-no-axes-combined
        description: "Optimalkan sumber daya serta biaya operasional dan pemeliharaan."
      - title: "Peningkatan kualitas layanan"
        icon: heart-handshake
        description: "Manfaatkan data real-time untuk layanan yang lebih responsif."

  - type: cta
    variant: CtaClosing_001
    eyebrow: "MULAI PERCAKAPAN"
