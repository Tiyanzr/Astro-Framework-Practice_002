# /kontak: data kontak dari site.yaml › contact, label formulir di bawah.
title: Kontak

sections:
  - type: hero
    title: Title
    description: Description

  - type: contact
    title: Title
    description: Description
    # Formulir masih mockup (belum terkirim). 1 item = 1 kolom isian; type = text | email | tel | textarea.
    form:
      fields:
        - { name: name, label: Nama, required: true }
        - { name: email, label: Email, type: email, required: true }
        - { name: phone, label: Telepon, type: tel }
        - { name: message, label: Pesan, type: textarea, required: true }
      submit: Kirim
