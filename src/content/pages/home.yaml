# Halaman utama (/). Ubah kalimat di sini, bukan di komponen.
# Halaman lain: buat file baru di folder ini, nama file = URL (produk.yaml → /produk).
#
# `sections` = susunan halaman, tampil berurutan dari atas ke bawah. Tukar urutan = pindahkan bloknya;
# section yang sama boleh dipakai lebih dari sekali. Setiap item:
#   type    = jenis section: hero | intro
#   variant = nama file variasi; bandingkan semua variasi di /prototype/<type>

# Opsional (beranda memakai nama & deskripsi situs dari site.yaml). Untuk halaman lain isi misalnya:
# title: Produk
# description: Deskripsi singkat halaman untuk mesin pencari.

sections:
  - type: hero
    # Variasi: src/components/sections/hero/
    variant: HeroImage_002
    title: Teknologi bertemu kebutuhan nyata.
    # Tombol (HeroImage_001), jumlah bebas; yang pertama = tombol utama. Contoh:
    # actions:
    #   - { label: Lihat Layanan, href: /layanan }
    #   - { label: Hubungi Kami, href: /kontak }
    # Daftar link di kartu (HeroImage_002). Kosong = item menu utama (src/content/menu/). Contoh:
    # links:
    #   - { label: Software, href: /software, description: CAD, CAM, PLM }
    # Foto hero (opsional): taruh fotonya di folder ini, lalu hapus tanda # di 3 baris berikut.
    # image:
    #   src: ./hero.jpg
    #   alt: Deskripsi singkat foto

  - type: intro
    # Variasi: src/components/sections/intro/
    variant: IntroMedia_002
    #   IntroMedia_001 = panel (width bawaan contained) · IntroMedia_002 = tanpa pembatas, selebar layar (width bawaan full)
    # Pembungkus section: tone = default | alt | dark | green | olive | gradient · width = full | contained
    # width boleh dihapus supaya memakai bawaan variasi. pulldown: true = ditarik ke atas, menumpuk di bawah hero (mulai tablet)
    tone: dark
    width: full
    pulldown: true
    # TODO: semua kalimat di bawah masih placeholder, ganti dengan konten final.
    title: Integrasi sistem otomasi, dari panel hingga data produksi.
    # Pisahkan paragraf dengan satu baris kosong.
    description: |
      Parametrik membantu industri merancang, memasang, dan merawat sistem kelistrikan dan otomasi: panel kontrol, PLC, SCADA, hingga integrasi data mesin ke sistem produksi.

      Sebagai integrator terbuka, kami menyesuaikan solusi dengan peralatan yang sudah Anda miliki, bukan sebaliknya.
    highlight: Satu mitra untuk seluruh rantai otomasi, dari sensor sampai laporan produksi.
    # Media di samping teks: video YouTube, gambar, atau placeholder.
    #   YouTube:     type: youtube · id: bagian setelah `v=` di link video · title: judul video
    #   Gambar:      type: image · src: ./intro.jpg (taruh di folder ini) · alt: deskripsi foto
    #   Placeholder: type: placeholder · label: teks kecil di tengah kotak
    # TODO: ganti dengan video Parametrik kalau sudah ada (type: youtube).
    media:
      type: placeholder
      label: Video profil perusahaan
