# Halaman utama (/). Ubah kalimat di sini, bukan di komponen.
# Halaman lain: buat file baru di folder ini, nama file = URL (produk.yaml → /produk, iot/energi.yaml → /iot/energi).
#
# `sections` = susunan halaman, tampil berurutan dari atas ke bawah. Tukar urutan = pindahkan bloknya;
# section yang sama boleh dipakai lebih dari sekali. Setiap item:
#   type    = jenis section: hero | intro | cards | catalog | posts | text | cta | contact
#   variant = nama file variasi (boleh dikosongkan = versi Basic); bandingkan variasi di /prototype/<type>
# TODO: semua teks masih placeholder.

sections:
  - type: hero
    variant: HeroImage_002
    title: Title
    description: Description
    # Tombol (HeroImage_001/Basic), jumlah bebas; yang pertama = tombol utama.
    actions:
      - { label: Software, href: /software }
      - { label: Kontak, href: /kontak }
    # Daftar link di kartu (HeroImage_002). Kosong = item menu utama (src/content/menu/).
    # Foto hero (opsional): taruh fotonya di folder ini, lalu isi:
    # image:
    #   src: ./hero.jpg
    #   alt: Deskripsi singkat foto

  - type: intro
    variant: IntroMedia_002
    # tone = default | alt | dark | green | olive | gradient · width = full | contained · pulldown = menumpuk di bawah hero
    tone: dark
    width: full
    pulldown: true
    title: Title
    description: |
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.

      Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.
    highlight: Highlight
    media:
      type: placeholder
      label: Video

  # Kartu manual: 3 pilar ke halaman utama masing-masing.
  - type: cards
    title: Title
    description: Description
    items:
      - { title: Software, description: Description, href: /software }
      - { title: IoT, description: Description, href: /iot }
      - { title: Layanan, description: Description, href: /layanan }

  # Ringkasan showcase: 2 produk pertama dari setiap kategori.
  - type: catalog
    title: Title
    description: Description
    limit: 2
    more: { label: Software, href: /software }

  # 3 artikel terbaru.
  - type: posts
    title: Title
    limit: 3
    more: { label: Artikel, href: /artikel }

  - type: cta
    title: Title
    description: Description
    actions:
      - { label: Kontak, href: /kontak }
